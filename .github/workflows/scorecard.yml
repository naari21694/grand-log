name: Scorecard supply-chain security
on:
  push:
    branches: ["main"]
  schedule:
    - cron: '30 1 * * 6'   # weekly, Sat 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard targets public repos; its checkout fails on a private repo. Run only when public
    # (matches the CodeQL gate), so CI stays clean while private and Scorecard runs once public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # OIDC token; required for publish_results
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
